name: Build luci-app-adguardhome IPK (filogic mt7981 24.10.1)
permissions:
  contents: write
  packages: write

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # 支持手动触发

env:
  OPENWRT_VER: "24.10.1"
  TARGET_BOARD: "mediatek/filogic"
  PLUGIN_REPO: "kenzok78/luci-app-adguardhome"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # 1. 拉取 kenzok78/luci-app-adguardhome 插件源码到 plugin-src
      - name: Checkout plugin source kenzok78/luci-app-adguardhome
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLUGIN_REPO }}
          path: plugin-src
          fetch-depth: 1

      # 2. 安装编译依赖
      - name: Install build dependencies
        run: |
          sudo apt update -y
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget zstd jq ccache

      # 3. 下载对应 filogic SDK
      - name: Download OpenWrt SDK (mediatek/filogic mt7981)
        run: |
          VER=${{ env.OPENWRT_VER }}
          TARGET=mediatek
          SUBTARGET=filogic
          FILE="openwrt-sdk-${VER}-${TARGET}-${SUBTARGET}_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          BASE="https://downloads.openwrt.org/releases/${VER}/targets/${TARGET}/${SUBTARGET}/"
          mkdir -p sdk
          wget -q "$BASE$FILE" -O sdk.tar.zst
          tar --zstd -xf sdk.tar.zst -C sdk
          SDK_DIR=$(find sdk -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n1)
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV
          echo "SDK Path: $SDK_DIR"

      # 4. 将插件源码拷贝进SDK package目录
      - name: Copy plugin source to SDK package dir
        run: |
          cd "${{ env.SDK_DIR }}"
          rm -rf package/luci-app-adguardhome
          mkdir -p package/luci-app-adguardhome
          # plugin-src 是插件仓库根目录，直接完整复制
          cp -r $GITHUB_WORKSPACE/plugin-src/* package/luci-app-adguardhome/
          ls -la package/luci-app-adguardhome/

      # 5. 更新 feeds 并生成配置
      - name: Update feeds & make defconfig
        run: |
          cd "${{ env.SDK_DIR }}"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      # 6. 清理旧编译产物，单线程编译防内存溢出
      - name: Compile luci-app-adguardhome
        run: |
          cd "${{ env.SDK_DIR }}"
          make package/luci-app-adguardhome/clean V=s
          make package/luci-app-adguardhome/compile V=s -j1

      # 7. 收集所有 adguardhome 相关ipk
      - name: Collect compiled IPK
        run: |
          mkdir -p out-ipk
          find "${{ env.SDK_DIR }}/bin/packages/" -name "*adguardhome*.ipk" -exec cp {} out-ipk/ \;
          echo "=== Compiled IPK List ==="
          ls -lh out-ipk/

      # 8. 自动创建Release上传IPK包
      - name: Release upload compiled IPK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OpenWrt ${{ env.OPENWRT_VER }} filogic(mt7981) Build #${{ github.run_number }}
          body: |
            ## 编译信息
            - 插件仓库：https://github.com/${{ env.PLUGIN_REPO }}
            - OpenWrt 版本：${{ env.OPENWRT_VER }}
            - 平台架构：mediatek/filogic (mt7981/mt7983/mt7988)
            - 编译方式：官方SDK独立编译 luci-app-adguardhome
            ## 内置
            ✅ luci-app-adguardhome 完整IPK安装包
          files: out-ipk/*.ipk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
