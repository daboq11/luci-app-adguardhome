name: Build luci-app-adguardhome IPK (OpenWrt 24.10 / Kernel 6.6)

# 触发规则：每2小时定时 + 推送代码 + 手动运行
on:
  schedule:
    - cron: "0 */2 * * *"
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  OW_VERSION: "24.10"
  KERNEL: "6.6"
  PKG_NAME: luci-app-adguardhome

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
    steps:
      - name: 1. 检出当前仓库源码（自带prepare.sh/patches）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 安装OpenWrt编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib-dev file wget curl
          # 释放磁盘空间防止编译磁盘不足
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - name: 3. 拉取 OpenWrt 24.10 源码
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout v${{ env.OW_VERSION }}

      - name: 4. 更新并安装feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 5. 复制本仓库插件到OpenWrt package目录
        run: |
          cd openwrt/package
          rm -rf ${{ env.PKG_NAME }}
          cp -r $GITHUB_WORKSPACE ./${{ env.PKG_NAME }}
          cd ${{ env.PKG_NAME }}
          # 执行仓库自带预处理脚本
          chmod +x .prepare.sh
          ./.prepare.sh

      - name: 6. 生成目标架构.config
        run: |
          cd openwrt
          cat > .config << EOF
CONFIG_TARGET_${{ matrix.arch }}=y
CONFIG_LUCI=y
CONFIG_PACKAGE_luci-base=y
CONFIG_PACKAGE_luci-compat=y
CONFIG_PACKAGE_luci-app-adguardhome=y
CONFIG_PACKAGE_adguardhome=y
CONFIG_TARGET_KERNEL_PARTSIZE=128
CONFIG_TARGET_ROOTFS_PARTSIZE=512
EOF
          make defconfig

      - name: 7. 编译插件生成IPK
        run: |
          cd openwrt
          make package/${{ env.PKG_NAME }}/compile V=s

      - name: 8. 收集所有ipk产物
        run: |
          mkdir -p ./ipk_output
          find openwrt/bin/packages/ -type f -name "*.ipk" -exec cp {} ./ipk_output/ \;
          ls -lh ./ipk_output

      - name: 9. 上传IPK到构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.arch }}-ow${{ env.OW_VERSION }}-k${{ env.KERNEL }}
          path: ./ipk_output/*.ipk
