name: Build & Release luci-app-adguardhome (filogic/mt7981)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # 拉取当前仓库 kenzok78/luci-app-adguardhome 完整源码
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          path: plugin-src

      # 安装编译依赖
      - name: Install build dependencies
        run: |
          sudo apt update -y
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget zstd jq

      # 下载 OpenWrt 24.10.1 filogic SDK
      - name: Download OpenWrt SDK (mediatek/filogic mt7981)
        run: |
          VER=24.10.1
          TARGET=mediatek
          SUBTARGET=filogic
          BASE="https://downloads.openwrt.org/releases/$VER/targets/$TARGET/$SUBTARGET/"
          FILE=$(curl -s "$BASE" | grep -oP 'openwrt-sdk-[^"]+\.tar\.zst' | head -n1)
          mkdir -p sdk
          wget -q "$BASE$FILE" -O sdk.tar.zst
          tar --zstd -xf sdk.tar.zst -C sdk
          SDK_DIR=$(find sdk -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n1)
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV

      # 关键适配：仓库根目录直接复制到 package/luci-app-adguardhome
      # 匹配官方README git clone 直接丢package目录的结构
      - name: Copy plugin to SDK package dir
        run: |
          cd "${{ env.SDK_DIR }}"
          mkdir -p package/luci-app-adguardhome
          # plugin-src 是仓库根目录，直接全部复制，无嵌套文件夹
          cp -r $GITHUB_WORKSPACE/plugin-src/* package/luci-app-adguardhome/
          ls package/luci-app-adguardhome/

      # 更新 feeds、加载依赖、生成配置
      - name: Update feeds & defconfig
        run: |
          cd "${{ env.SDK_DIR }}"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      # 清理并单线程编译，避免actions内存溢出
      - name: Compile luci-app-adguardhome
        run: |
          cd "${{ env.SDK_DIR }}"
          make package/luci-app-adguardhome/clean V=s
          make package/luci-app-adguardhome/compile V=s -j1

      # 收集输出ipk安装包
      - name: Collect compiled IPK
        run: |
          mkdir -p out-ipk
          find "${{ env.SDK_DIR }}/bin/packages/" -name "*adguardhome*.ipk" -exec cp {} out-ipk/ \;
          echo "Compiled IPK list:"
          ls -lh out-ipk/

      # 自动发布Release上传安装包
      - name: Release upload IPK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OpenWrt 24.10.1 filogic(mt7981) Build #${{ github.run_number }}
          body: |
            ### 编译说明
            插件来源：https://github.com/kenzok78/luci-app-adguardhome
            OpenWrt版本：24.10.1
            平台：mediatek/filogic (mt7981/mt7983/mt7988)
            编译方式：SDK独立编译 luci-app-adguardhome
            仓库目录结构适配原版README编译规范
          files: out-ipk/*.ipk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
