name: 构建与发布 luci-app-adguardhome （filogic/mt7981）

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # 拉取当前仓库完整源码
      - name: Checkout plugin source
        uses: actions/checkout@v4
        with:
          path: plugin-src

      # 安装编译依赖
      - name: Install build dependencies
        run: |
          sudo apt update -y
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget zstd jq

      # 下载 OpenWrt 24.10.1 filogic SDK
      - name: Download OpenWrt SDK mediatek/filogic 24.10.1
        run: |
          VER=24.10.1
          TARGET=mediatek
          SUBTARGET=filogic
          BASE="https://downloads.openwrt.org/releases/$VER/targets/$TARGET/$SUBTARGET/"
          FILE=$(curl -s "$BASE" | grep -oP 'openwrt-sdk-[^"]+\.tar\.zst' | head -n1)
          mkdir -p sdk
          wget -q "$BASE$FILE" -O sdk.tar.zst
          tar --zstd -xf sdk.tar.zst -C sdk
          SDK_DIR=$(find sdk -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n1)
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV

      # 复刻 README git clone 逻辑：完整拷贝仓库文件到 package/luci-app-adguardhome
      - name: Copy source & fix duplicate BuildPackage entry
        run: |
          cd "${{ env.SDK_DIR }}"
          mkdir -p package/luci-app-adguardhome
          # 正确拷贝写法，等同于 git clone 效果，不漏任何文件（含Makefile）
          cp -r "$GITHUB_WORKSPACE/plugin-src/." package/luci-app-adguardhome/

          # 打印目录用于排错
          echo "==== package/luci-app-adguardhome 目录文件 ===="
          ls -la package/luci-app-adguardhome/

          # 强制校验Makefile存在，不存在直接终止流程
          if [ ! -f package/luci-app-adguardhome/Makefile ]; then
            echo "错误：未复制到插件Makefile，源码拷贝失败！"
            exit 1
          fi

          cd package/luci-app-adguardhome
          echo "===== 修复前 Makefile 尾部 ====="
          tail -10 Makefile
          # 删除多余BuildPackage，解决menuconfig双选项（适配24.10/25.12）
          sed -i '/call BuildPackage - OpenWrt buildroot signature/d' Makefile
          sed -i '/$(eval \$(call BuildPackage,luci-app-adguardhome))/d' Makefile
          echo -e "\n===== 修复后 Makefile 尾部 ====="
          tail -10 Makefile

      # 更新 feeds、生成默认配置
      - name: Update feeds & make defconfig
        run: |
          cd "${{ env.SDK_DIR }}"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      # 清理并单线程编译，避免Action内存溢出
      - name: Compile luci-app-adguardhome
        run: |
          cd "${{ env.SDK_DIR }}"
          make package/luci-app-adguardhome/clean V=s
          make package/luci-app-adguardhome/compile V=s -j1

      # 收集编译产出IPK
      - name: Collect compiled IPK packages
        run: |
          mkdir -p output-ipk
          find "${{ env.SDK_DIR }}/bin/packages/" -type f -name "*adguardhome*.ipk" -exec cp {} output-ipk/ \;
          echo "==== 已生成IPK列表 ===="
          ls -lh output-ipk/

      # 自动创建Release上传安装包
      - name: Create Release & Upload IPK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OpenWrt 24.10.1 filogic(mt7981) Build #${{ github.run_number }}
          body: |
            ## 编译信息
            插件仓库：https://github.com/kenzok78/luci-app-adguardhome
            SDK：OpenWrt 24.10.1 mediatek/filogic
            适配设备：mt7981/mt7983/mt7988 全系filogic路由
            兼容固件：OpenWrt 24.10 / ImmortalWrt 24.10 & 25.12
            处理优化：自动移除重复BuildPackage定义，消除menuconfig双选项BUG
            编译方式：完全匹配仓库README git clone 直接编译逻辑
          files: output-ipk/*.ipk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
